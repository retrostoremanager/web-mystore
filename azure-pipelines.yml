# Azure Pipeline for MyStore Web Application
# This pipeline builds and deploys the React application to Azure Storage Static Website
# Supports: dev and test environments

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - src/*
      - package.json
      - vite.config.js

parameters:
  - name: environment
    displayName: 'Target Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - test

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'
  # Environment-specific variables
  - group: 'mystore-web-${{ parameters.environment }}'

stages:
- stage: Build
  displayName: 'Build React Application'
  jobs:
  - job: Build
    displayName: 'Build and Package'
    steps:
    - checkout: self
      displayName: 'Checkout code from GitHub'
      persistCredentials: true

    - task: NodeTool@0
      displayName: 'Use Node.js $(nodeVersion)'
      inputs:
        versionSpec: '$(nodeVersion)'

    - task: Npm@1
      displayName: 'Install dependencies'
      inputs:
        command: 'install'
        workingDir: '.'

    - task: Npm@1
      displayName: 'Build application'
      inputs:
        command: 'custom'
        workingDir: '.'
        customCommand: 'run build'
      env:
        VITE_API_URL: $(functionAppUrl)

    - task: PublishBuildArtifacts@1
      displayName: 'Publish build artifacts'
      inputs:
        pathToPublish: '$(System.DefaultWorkingDirectory)/dist'
        artifactName: 'web-app'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy Web Application to ${{ parameters.environment }}'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    displayName: 'Deploy to Azure Storage Static Website'
    environment: '${{ parameters.environment }}'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: web-app
            displayName: 'Download build artifacts'

          - task: AzureCLI@2
            displayName: 'Deploy to Static Website'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Deploying to Azure Storage Static Website..."
                
                # Upload files to $web container
                az storage blob upload-batch \
                  --account-name $(storageAccountName) \
                  --destination '$web' \
                  --source $(Pipeline.Workspace)/web-app \
                  --auth-mode login \
                  --overwrite
                
                # Get the static website URL
                WEBSITE_URL=$(az storage account show \
                  --name $(storageAccountName) \
                  --resource-group $(resourceGroupName) \
                  --query "primaryEndpoints.web" \
                  --output tsv)
                
                echo "##[section]Web Application Deployment Complete - ${{ parameters.environment }}"
                echo "Static Website URL: $WEBSITE_URL"
                echo "Storage Account: $(storageAccountName)"
                echo "Environment: ${{ parameters.environment }}"
