name: Test

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          # Publishable keys are safe to expose client-side (that's what they're for) and this
          # is a placeholder test-mode value anyway -- it only needs to be present so SignUpForm
          # renders its real form instead of the "Stripe not configured" warning; no test here
          # calls out to Stripe for real.
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder_not_a_real_key
        run: npm test -- --run
