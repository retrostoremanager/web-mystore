name: Deploy Web App to Azure Static Web Apps

on:
  push:
    branches:
      - development
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify VITE_GAMEDB_API_URL (required at build time)
        env:
          VITE_GAMEDB_API_URL: ${{ vars.VITE_GAMEDB_API_URL || secrets.VITE_GAMEDB_API_URL }}
        run: |
          if [ -z "${VITE_GAMEDB_API_URL:-}" ]; then
            echo "::error::VITE_GAMEDB_API_URL is empty. Add it on GitHub: Settings -> Secrets and variables -> Actions -> Variables (or Secrets), name exactly VITE_GAMEDB_API_URL, value e.g. https://gamedb-func-dev.azurewebsites.net/api."
            exit 1
          fi
          echo "VITE_GAMEDB_API_URL is set (${#VITE_GAMEDB_API_URL} characters)."

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_URL: https://mystore-func-dev.azurewebsites.net/api
          VITE_GAMEDB_API_URL: ${{ vars.VITE_GAMEDB_API_URL || secrets.VITE_GAMEDB_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
          app_build_command: "npm run build"

      - name: Trigger test agent for recently merged PR
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          # Find the most recently merged PR into development
          PR_DATA=$(GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh pr list \
            --repo retrostoremanager/web-mystore \
            --base development --state merged \
            --limit 1 \
            --json number,body)
          PR_NUMBER=$(echo "$PR_DATA" | jq -r ".[0].number // empty")
          if [ -z "$PR_NUMBER" ]; then
            echo "No recently merged PR found — skipping test agent trigger"
            exit 0
          fi
          ORCHESTRATOR_ISSUE=$(echo "$PR_DATA" | jq -r ".[0].body" \
            | grep -oP 'orchestrator-mystore#\K[0-9]+' | head -1 || true)
          echo "Triggering test agent for PR #$PR_NUMBER (issue #${ORCHESTRATOR_ISSUE:-none})"
          jq -n --arg pr "$PR_NUMBER" --arg issue "${ORCHESTRATOR_ISSUE:-}" \
            '{"ref":"main","inputs":{"pr_numbers":$pr,"target_repo":"web-mystore","orchestrator_issues":$issue}}' | \
          gh api repos/retrostoremanager/fn-mystore/actions/workflows/test-agent.yml/dispatches \
            --method POST --input -

