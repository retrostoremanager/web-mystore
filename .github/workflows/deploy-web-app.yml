name: Deploy Web App to Azure Static Web Apps

on:
  pull_request:
    types: [closed]
    branches:
      - development
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify VITE_GAMEDB_API_URL (required at build time)
        env:
          VITE_GAMEDB_API_URL: ${{ vars.VITE_GAMEDB_API_URL || secrets.VITE_GAMEDB_API_URL }}
        run: |
          if [ -z "${VITE_GAMEDB_API_URL:-}" ]; then
            echo "::error::VITE_GAMEDB_API_URL is empty. Add it on GitHub: Settings → Secrets and variables → Actions → Variables (or Secrets), name exactly VITE_GAMEDB_API_URL, value e.g. https://gamedb-func-dev.azurewebsites.net/api. Azure SWA Configuration in the portal does NOT apply to this GitHub build."
            exit 1
          fi
          echo "VITE_GAMEDB_API_URL is set (${#VITE_GAMEDB_API_URL} characters)."

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_URL: https://mystore-func-dev.azurewebsites.net/api
          VITE_GAMEDB_API_URL: ${{ vars.VITE_GAMEDB_API_URL || secrets.VITE_GAMEDB_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"
          app_build_command: "npm run build"

      - name: Trigger test agent
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          ORCHESTRATOR_ISSUE=$(gh pr view "$PR_NUMBER" --repo sbranham314/web-mystore \
            --json body --jq '.body' \
            | grep -oP 'orchestrator-mystore#\K[0-9]+' | head -1 || true)
          gh api repos/sbranham314/fn-mystore/actions/workflows/test-agent.yml/dispatches \
            --method POST \
            --field ref=main \
            --field "inputs[pr_number]=$PR_NUMBER" \
            --field "inputs[target_repo]=web-mystore" \
            --field "inputs[orchestrator_issue]=${ORCHESTRATOR_ISSUE:-}"
