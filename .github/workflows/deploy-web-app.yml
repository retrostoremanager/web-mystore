name: Deploy Web App

on:
  push:
    branches:
      - development
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Serialize deploys to the shared dev Static Web App (served at dev.retrostoremanager.com).
# Concurrent pushes to development previously raced and finished out of order, leaving
# stale assets in dev. Run one at a time; let the newest queued deploy win.
concurrency:
  group: deploy-web-app-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: development

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      env:
        VITE_API_URL: https://mystore-func-dev.azurewebsites.net/api
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        VITE_GAMEDB_API_URL: ${{ secrets.VITE_GAMEDB_API_URL }}
        VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
      run: npm run build

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Static Web App
      run: |
        # dev.retrostoremanager.com is served by the SWA with default hostname
        # jolly-cliff-047c0730f. Resolve its name/RG and pull the deployment token
        # at runtime so no extra secret is required.
        SWA_NAME=$(az staticwebapp list \
          --query "[?contains(defaultHostname, 'jolly-cliff-047c0730f')].name | [0]" -o tsv)
        if [ -z "$SWA_NAME" ]; then
          echo "ERROR: Static Web App (jolly-cliff-047c0730f) not visible to this service principal." >&2
          exit 1
        fi
        SWA_RG=$(az staticwebapp list \
          --query "[?name=='${SWA_NAME}'].resourceGroup | [0]" -o tsv)
        echo "Resolved Static Web App: ${SWA_NAME} (resource group: ${SWA_RG})"
        SWA_TOKEN=$(az staticwebapp secrets list \
          --name "$SWA_NAME" --resource-group "$SWA_RG" \
          --query "properties.apiKey" -o tsv)
        npx -y @azure/static-web-apps-cli@latest deploy ./dist \
          --deployment-token "$SWA_TOKEN" \
          --env production

    - name: Deployment Complete
      run: |
        echo "Web App deployed successfully!"
        echo "URL: https://dev.retrostoremanager.com/"
