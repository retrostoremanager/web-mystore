name: Deploy Web App

on:
  push:
    branches:
      - development
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# Serialize deploys to the shared dev web app ($web in mystorestgdev). Concurrent
# pushes to development previously raced on upload-batch and finished out of order,
# leaving stale assets in dev. Run one at a time; let the newest queued deploy win.
concurrency:
  group: deploy-web-app-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: development

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build
      env:
        VITE_API_URL: https://mystore-func-dev.azurewebsites.net/api
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
        VITE_GAMEDB_API_URL: ${{ secrets.VITE_GAMEDB_API_URL }}
        VITE_ENTRA_CLIENT_ID: ${{ secrets.VITE_ENTRA_CLIENT_ID }}
      run: npm run build

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Storage
      run: |
        az storage blob upload-batch \
          --account-name mystorestgdev \
          --source ./dist \
          --destination '$web' \
          --overwrite \
          --auth-mode login

    - name: Deployment Complete
      run: |
        echo "Web App deployed successfully!"
        echo "URL: https://mystorestgdev.z13.web.core.windows.net/"
